<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>그림으로 말하는 전치사 · 영상</title>
<style>
  :root { --bg: #fdedcf; --ink: #203754; --soft: #5a6b80; --accent: #be3a1c; --pill: #f4deba; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.6 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 20px 60px; }
  .brand { color: var(--accent); font-weight: 800; letter-spacing: .04em; font-size: 14px; }
  h1 { font-size: 30px; line-height: 1.3; margin: 6px 0 4px; }
  p { margin: 10px 0; color: var(--soft); }
  a.go { display: block; margin: 22px 0; padding: 18px 20px; border-radius: 16px; background: var(--accent); color: #fff9ee; font-size: 22px; font-weight: 800; text-align: center; text-decoration: none; }
  ol { list-style: none; padding: 0; margin: 20px 0; }
  li a { display: flex; gap: 12px; padding: 14px 16px; margin: 8px 0; border-radius: 14px; background: var(--pill); color: var(--ink); text-decoration: none; font-weight: 600; }
  li b { color: var(--accent); min-width: 3.2em; }
  li.off a { opacity: .45; pointer-events: none; }
  h2 { font-size: 18px; margin: 28px 0 0; color: var(--soft); }
</style>
</head>
<body>
<main id="app">
  <div class="brand">한 그림 세 쓰임</div>
  <h1>그림으로 말하는 전치사</h1>
  <p>영상 주소를 불러오는 중입니다.</p>
</main>
<script src="links.js"></script>
<script>
// 「그림으로 말하는 전치사」 책 속 QR은 이 쪽으로 온다:  ?1-5  =  1권 5과,  ?1 = 1권 차례.   영상 주소는 links.js 한 곳에서만 고친다 (make_go.py 가 만듦).
(function () {
  var app = document.getElementById("app");
  var m = /^\??(\d+)(?:-(\d+))?/.exec(location.search || "");
  var vol = m ? m[1] : null, les = m && m[2] ? +m[2] : null;
  var B = vol && window.LINKS[vol];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var head = '<div class="brand">한 그림 세 쓰임</div><h1>그림으로 말하는 전치사</h1>';
  if (!B) {
    app.innerHTML = head + "<p>책 속의 QR을 다시 찍어 주세요.</p>" + '<a class="go" href="' + window.CHANNEL + '">유튜브 채널로 가기</a>';
    return;
  }
  var url = function (n) { return B.urls[n - 1] || null; };
  if (les && url(les)) {                  // 과가 정해져 있으면 바로 보낸다
    var to = url(les);
    app.innerHTML = head + "<p>" + vol + "권 " + les + "과 · " + esc(B.titles[les - 1]) + "</p>" +
      '<a class="go" href="' + to + '">영상 보러 가기</a><p>자동으로 넘어가지 않으면 위 단추를 눌러 주세요.</p>';
    location.replace(to);
    return;
  }
  var html = head + "<p>" + vol + "권 「" + esc(B.name) + "」 과 영상</p>";
  if (les) html += "<p>" + les + "과 영상은 아직 준비 중입니다. 아래에서 다른 과를 고르실 수 있습니다.</p>";
  html += "<ol>";
  for (var n = 1; n <= B.titles.length; n++) {
    var u = url(n);
    html += '<li class="' + (u ? "" : "off") + '"><a href="' + (u || "#") + '"><b>' + n + "과</b><span>" + esc(B.titles[n - 1]) + "</span></a></li>";
  }
  html += "</ol>";
  if (B.playlist) html += '<a class="go" href="' + B.playlist + '">재생목록으로 보기</a>';
  app.innerHTML = html + '<a class="go" style="background:#5a6b80" href="' + window.CHANNEL + '">유튜브 채널로 가기</a>';
})();
</script>
<noscript><p style="padding:20px">영상은 유튜브 채널 <a href="https://www.youtube.com/@englishverbpattern">영어동사패턴</a>에서 보실 수 있습니다.</p></noscript>
</body>
</html>
